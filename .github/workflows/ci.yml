name: Java CI with Maven, Test, Docker, and SonarQube

on:
push:
    branches: [ "main", "master", "feature/**" ]
pull_request:
    branches: [ "main", "master","development", "feature/**" ]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
        - name: Checkout code
        uses: actions/checkout@v3
        with:
            fetch-depth: 0  # Important for SonarQube analysis

        - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
            java-version: '21'
            distribution: 'temurin'

        - name: Cache Maven packages
        uses: actions/cache@v3
        with:
            path: ~/.m2
            key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
            restore-keys: ${{ runner.os }}-m2

        - name: Build and test with Maven
        run: mvn clean verify

        - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v3
        with:
            name: junit-results
            path: target/surefire-reports

        - name: Upload Code Coverage Report
        if: always()
        uses: actions/upload-artifact@v3
        with:
            name: jacoco-report
            path: target/site/jacoco

        - name: SonarQube Analysis
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
            mvn clean verify sonar:sonar \
            -Dsonar.projectKey=${{ github.repository }} \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.projectName="${{ github.repository }}" \
            -Dsonar.projectVersion=1.0.0 \
            -Dsonar.sources=src/main/java \
            -Dsonar.tests=src/test/java \
            -Dsonar.java.binaries=target/classes \
            -Dsonar.java.test.binaries=target/test-classes \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.junit.reportPaths=target/surefire-reports

        - name: SonarQube Quality Gate Check
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
            # Wait for SonarQube analysis to complete
            sleep 30

            # Check quality gate status
            curl -u $SONAR_TOKEN: \
            "${{ secrets.SONAR_HOST_URL }}/api/qualitygates/project_status?projectKey=${{ github.repository }}" \
            -o quality-gate-result.json

            # Parse and check quality gate status
            if jq -e '.projectStatus.status == "OK"' quality-gate-result.json; then
                echo "✅ SonarQube Quality Gate passed"
            else
                echo "❌ SonarQube Quality Gate failed"
                jq '.projectStatus.conditions[] | select(.status != "OK") | "Condition: " + .metricKey + " - Status: " + .status + " - Value: " + .actualValue' quality-gate-result.json
                exit 1
            fi

        - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

        - name: Build Docker image
        run: docker build -t springboot-app:latest .

        - name: Upload SonarQube Report
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v3
        with:
            name: sonarqube-report
            path: |
                target/sonar/
                quality-gate-result.json
